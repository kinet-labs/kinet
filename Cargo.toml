jemalloc_pprof = "0.8"
k256 = { version = "0.13", features = ["hash2curve"] }
libc = "0.2.153"
lru = "0.16"
lz4 = "1.28"
mongodb = { version = "3.7.0", default-features = false, features = ["compat-3-0-0", "dns-resolver", "openssl-tls"] }
monoio = { git = "https://github.com/kinet-labs/monoio.git", rev = "b9e6882c24efba1d645a5d20df4e0cb431f3ef60", features = ["sync", "iouring"] }
ntest = "0.9"
once_cell = "1.19.0"
opentelemetry = "0.31"
opentelemetry-otlp = "0.31"
opentelemetry-semantic-conventions = "0.29"
opentelemetry_sdk = "0.31"
paste = "1.0.15"
