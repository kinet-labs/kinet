[package]
name = "kinet-testground"
version = "0.1.0"
edition = "2021"

# this is necessary for criterion bench options
# https://bheisler.github.io/criterion.rs/book/faq.html#cargo-bench-gives-unrecognized-option-errors-for-valid-command-line-options
[[bin]]
name = "kinet-testground"
bench = false

[dependencies]
kinet-bls = { workspace = true }
kinet-chain-config = { workspace = true }
kinet-consensus-state = { workspace = true }
kinet-consensus-types = { workspace = true }
kinet-control-panel = { workspace = true }
kinet-crypto = { workspace = true }
kinet-dataplane = { workspace = true }
kinet-execution-state-read = { workspace = true }
kinet-executor = { workspace = true }
kinet-executor-glue = { workspace = true }
kinet-node-config = { workspace = true }
kinet-peer-discovery = { workspace = true }
kinet-raptorcast = { workspace = true }
kinet-secp = { workspace = true }
kinet-state = { workspace = true }
kinet-types = { workspace = true }
kinet-updaters = { workspace = true, features = ["tokio"] }
kinet-validator = { workspace = true }

clap = { workspace = true, features = ["derive"] }
futures-util = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic"] }
opentelemetry-semantic-conventions = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
rand = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true, features = ["log"] }
tracing-appender = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
