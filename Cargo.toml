toml = "0.9"
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-appender = "0.2"
kinetracing = { git = "https://github.com/kinet-labs/kinet-trace.git", rev = "cf194d9716a902948e5ec31e650b7726e7105edc" }
