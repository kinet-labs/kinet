[package]
name = "kinet-twins-utils"
version = "0.1.0"
edition = "2021"

# this is necessary for criterion bench options
# https://bheisler.github.io/criterion.rs/book/faq.html#cargo-bench-gives-unrecognized-option-errors-for-valid-command-line-options
[lib]
bench = false

[dependencies]
kinet-chain-config = { workspace = true }
kinet-consensus-state = { workspace = true }
kinet-consensus-types = { workspace = true }
kinet-crypto = { workspace = true }
kinet-mock-swarm = { workspace = true }
kinet-router-scheduler = { workspace = true }
kinet-state = { workspace = true }
kinet-execution-state-read = { workspace = true }
kinet-testutil = { workspace = true }
kinet-transformer = { workspace = true }
kinet-types = { workspace = true }
kinet-updaters = { workspace = true }
kinet-validator = { workspace = true }

itertools = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
