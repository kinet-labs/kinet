[package]
name = "kinet-raptorcast"
version = "0.1.0"
edition = "2021"

# this is necessary for criterion bench options
# https://bheisler.github.io/criterion.rs/book/faq.html#cargo-bench-gives-unrecognized-option-errors-for-valid-command-line-options
[lib]
bench = false

[dependencies]
kinet-compress = { workspace = true }
kinet-crypto = { workspace = true }
kinet-dataplane = { workspace = true }
kinet-executor = { workspace = true }
kinet-executor-glue = { workspace = true }
kinet-leanudp = { workspace = true }
kinet-merkle = { workspace = true }
kinet-node-config = { workspace = true }
kinet-peer-discovery = { workspace = true }
kinet-peer-score = { workspace = true }
kinet-raptor = { workspace = true }
kinet-secp = { workspace = true }
kinet-types = { workspace = true }
kinet-validator = { workspace = true }
kinet-wireauth = { workspace = true }

alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }
bitvec = { workspace = true }
bytes = { workspace = true }
fixed = { workspace = true }
futures = { workspace = true }
governor = { workspace = true }
hex = { workspace = true }
indexmap = { workspace = true }
iset = { workspace = true }
itertools = { workspace = true }
lru = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tracing = { workspace = true }
zerocopy = { workspace = true }

[dev-dependencies]
kinet-testutil = { workspace = true }

clap = { workspace = true, features = ["derive"] }
criterion = { workspace = true }
eyre = { workspace = true }
futures-util = { workspace = true }
humantime = { workspace = true }
insta = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true, features = ["metrics", "grpc-tonic"] }
opentelemetry-semantic-conventions = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
rstest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tikv-jemallocator = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "test-util"] }
toml = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[[bench]]
name = "raptor_bench"
harness = false

[[bench]]
name = "encode_bench"
harness = false

[[example]]
name = "service"

[[example]]
name = "latency"
