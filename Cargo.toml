url = "2.5.0"
wasm-bindgen = "0.2"
wycheproof = "0.6.0"
zerocopy = { version = "0.8", features = ["derive"] }
zeroize = { version = "1.7", features = ["derive"] }
zstd = "0.13"

[profile.dev]
opt-level = 1

[profile.release]
debug = true
lto = "thin"
panic = "abort"
