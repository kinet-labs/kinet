rand_distr = "0.4"
rayon = "1.7"
regex = "1.10.2"
reqwest = { version = "0.12.28", features = ["json"] }
rstest = "0.25.0"
schemars = "0.8.21"
scrypt = { version = "0.11", default-features = false }
secp256k1 = "0.31"
seq-macro = "0.3.6"
