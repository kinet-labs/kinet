alloy-signer-local = "2.0"
alloy-sol-macro = "1.5"
alloy-sol-types = "1.5"
alloy-transport = "2.0"
alloy-transport-http = { version = "2.0", default-features = false, features = ["reqwest", "reqwest-native-tls"] }
arbitrary = "1.4.1"
arrayvec = { version = "0.7", features = ["serde"] }
as-any = "0.3.1"
async-channel = "2.5"
async-graphql = "7.0"
async-stream = "0.3.6"
async-trait = "0.1"
auto_impl = "1.2"
awc = { version = "3", default-features = false }
aws-config = "1.8.13"
aws-sdk-dynamodb = { version = "1.104.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1.122.0", default-features = false, features = ["behavior-version-latest", "sigv4a", "rt-tokio", "default-https-client"] }
base64 = "0.22.1"
bincode = "1.3"
