[package]
name = "kinet-statesync-executor"
version = "0.1.0"
edition = "2021"

# this is necessary for criterion bench options
# https://bheisler.github.io/criterion.rs/book/faq.html#cargo-bench-gives-unrecognized-option-errors-for-valid-command-line-options
[lib]
bench = false

[dependencies]
kinet-chain-config = { workspace = true }
kinet-crypto = { workspace = true }
kinet-cxx = { workspace = true }
kinet-eth-types = { workspace = true }
kinet-executor = { workspace = true }
kinet-executor-glue = { workspace = true }
kinet-statesync = { workspace = true }
kinet-types = { workspace = true }
kinet-validator = { workspace = true }

alloy-consensus = { workspace = true }
alloy-rlp = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
tempfile = { workspace = true }

[[bench]]
name = "ipc_bench"
harness = false
