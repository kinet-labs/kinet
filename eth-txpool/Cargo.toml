[package]
name = "kinet-eth-txpool"
version = "0.1.0"
edition = "2021"

# this is necessary for criterion bench options
# https://bheisler.github.io/criterion.rs/book/faq.html#cargo-bench-gives-unrecognized-option-errors-for-valid-command-line-options
[lib]
bench = false

[dependencies]
kinet-chain-config = { workspace = true }
kinet-consensus-types = { workspace = true }
kinet-crypto = { workspace = true }
kinet-eth-block-policy = { workspace = true }
kinet-eth-txpool-types = { workspace = true }
kinet-eth-types = { workspace = true }
kinet-execution-state-read = { workspace = true }
kinet-executor = { workspace = true }
kinet-system-calls = { workspace = true }
kinet-tfm = { workspace = true }
kinet-types = { workspace = true }
kinet-validator = { workspace = true }

alloy-consensus = { workspace = true }
alloy-eips = { workspace = true }
alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
kinet-crypto = { workspace = true }
kinet-eth-block-validator = { workspace = true }
kinet-eth-testutil = { workspace = true }
kinet-perf-util = { workspace = true }
kinet-testutil = { workspace = true }
kinet-types = { workspace = true }

alloy-consensus = { workspace = true, features = ["k256"] }
alloy-primitives = { workspace = true, features = ["getrandom"] }
alloy-signer = { workspace = true }
alloy-signer-local = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }
rand = { workspace = true }
rand_chacha = { workspace = true }
rayon = { workspace = true }
tracing-test = { workspace = true }

[[bench]]
name = "create_proposal"
harness = false

[[bench]]
name = "insert"
harness = false

[[bench]]
name = "update"
harness = false
