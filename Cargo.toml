kinet-triedb-utils = { path = "./triedb-utils" }
kinet-twins-utils = { path = "./twins/utils" }
kinet-types = { path = "./types" }
kinet-updaters = { path = "./updaters" }
kinet-validator = { path = "./validator" }
kinet-version = { path = "./version" }
kinet-wal = { path = "./wal" }
kinet-wal-derive = { path = "./wal-derive" }
kinet-wireauth = { path = "./wireauth" }

kinet-cxx = { path = "./execution/rust/crates/kinet-cxx" }
kinet-ethcall = { path = "./execution/rust/crates/kinet-ethcall" }
kinet-event-ring = { path = "./execution/rust/crates/kinet-event-ring" }
kinet-exec-events = { path = "./execution/rust/crates/kinet-exec-events" }
kinet-statesync = { path = "./execution/rust/crates/kinet-statesync" }
kinet-statesync-version = { path = "./execution/rust/crates/kinet-statesync-version" }
kinet-triedb = { path = "./execution/rust/crates/kinet-triedb" }

actix = "0.13"
actix-http = { version = "3.11.1", default-features = false }
actix-rt = "2.9.0"
actix-server = "2.5.1"
actix-test = { version = "0.1", default-features = false }
actix-web = { version = "4.12.1", default-features = false, features = ["macros", "http2", "unicode", "ws"] }
actix-ws = "0.3.0"
aegis = "0.5"
aes = "0.8.3"
agent = { git = "https://github.com/kinet-labs/kinet-trace.git", rev = "cf194d9716a902948e5ec31e650b7726e7105edc" }
alloy-consensus = "2.0"
alloy-eips = "2.0"
alloy-json-rpc = "2.0"
alloy-network = "2.0"
alloy-primitives = "1.5"
alloy-rlp = { version = "0.3", features = ["arrayvec"] }
alloy-rpc-client = "2.0"
alloy-rpc-types = { version = "2.0", default-features = false, features = ["eth"] }
alloy-rpc-types-eth = "2.0"
alloy-rpc-types-trace = "2.0"
