[workspace]
resolver = "2"
members = [
    "archive",
    "block-persist",
    "blocksync",
    "blocktree",
    "bls",
    "chain-config",
    "compress",
    "consensus",
    "consensus-state",
    "consensus-types",
    "control-panel",
    "crypto",
    "dataplane",
    "debug-node",
    "debugger",
    "eth-block-policy",
    "eth-block-validator",
    "eth-ledger",
    "eth-testutil",
    "eth-txpool",
    "eth-txpool-executor",
    "eth-txpool-ipc",
    "eth-txpool-types",
    "eth-types",
    "execution-state-read",
    "execution-state-read-cache",
    "executor",
    "executor-glue",
    "fair-queue",
    "keystore",
    "leanudp",
    "ledger",
    "mcp-chorus",
    "mcp-chorus-sim",
    "merkle",
    "mock-swarm",
    "multi-sig",
    "node",
    "node-config",
    "peer-disc-swarm",
    "peer-discovery",
    "peer-score",
    "perf-util",
    "pprof",
    "randomized-tests",
    "raptor",
    "router-multi",
    "router-scheduler",
    "rpc",
    "secp",
    "sim",
    "sim-swarm",
    "state",
    "statesync-executor",
    "system-calls",
    "testground",
    "testutil",
    "tfm",
    "tracing-timing",
    "transformer",
    "triedb-utils",
    "twins",
    "types",
    "updaters",
    "validator",
    "version",
    "wal",
    "wal-derive",
    "wireauth",
]
exclude = ["execution", "fuzz", "scripts"]

[workspace.metadata.cargo-shear]
ignored = ["alloy-transport-http", "getrandom", "kinet-peer-disc-swarm"]

[workspace.dependencies]
kinet-archive = { path = "./archive" }
kinet-block-persist = { path = "./block-persist" }
kinet-blocksync = { path = "./blocksync" }
kinet-blocktree = { path = "./blocktree" }
kinet-bls = { path = "./bls" }
kinet-chain-config = { path = "./chain-config" }
kinet-compress = { path = "./compress" }
kinet-consensus = { path = "./consensus" }
kinet-consensus-state = { path = "./consensus-state" }
kinet-consensus-types = { path = "./consensus-types" }
kinet-control-panel = { path = "./control-panel" }
kinet-crypto = { path = "./crypto" }
kinet-dataplane = { path = "./dataplane" }
kinet-eth-block-policy = { path = "./eth-block-policy" }
kinet-eth-block-validator = { path = "./eth-block-validator" }
kinet-eth-ledger = { path = "./eth-ledger" }
kinet-eth-testutil = { path = "./eth-testutil" }
kinet-eth-txpool = { path = "./eth-txpool" }
kinet-eth-txpool-executor = { path = "./eth-txpool-executor" }
kinet-eth-txpool-ipc = { path = "./eth-txpool-ipc" }
kinet-eth-txpool-types = { path = "./eth-txpool-types" }
kinet-eth-types = { path = "./eth-types" }
kinet-execution-state-read = { path = "./execution-state-read" }
kinet-execution-state-read-cache = { path = "./execution-state-read-cache" }
kinet-executor = { path = "./executor" }
kinet-executor-glue = { path = "./executor-glue" }
kinet-fair-queue = { path = "./fair-queue" }
kinet-keystore = { path = "./keystore" }
kinet-leanudp = { path = "./leanudp" }
kinet-ledger = { path = "./ledger" }
kinet-mcp-chorus = { path = "./mcp-chorus" }
kinet-merkle = { path = "./merkle" }
kinet-mock-swarm = { path = "./mock-swarm" }
kinet-multi-sig = { path = "./multi-sig" }
kinet-node-config = { path = "./node-config" }
kinet-peer-disc-swarm = { path = "./peer-disc-swarm" }
kinet-peer-discovery = { path = "./peer-discovery" }
kinet-peer-score = { path = "./peer-score" }
kinet-perf-util = { path = "./perf-util" }
kinet-pprof = { path = "./pprof" }
kinet-raptor = { path = "./raptor" }
kinet-raptorcast = { path = "./raptorcast" }
kinet-router-multi = { path = "./router-multi" }
kinet-router-scheduler = { path = "./router-scheduler" }
kinet-rpc-docs = { path = "./rpc/rpc-docs" }
kinet-rpc-docs-derive = { path = "./rpc/rpc-docs/rpc-docs-derive" }
kinet-secp = { path = "./secp" }
kinet-sim = { path = "./sim" }
kinet-sim-swarm = { path = "./sim-swarm" }
kinet-state = { path = "./state" }
kinet-statesync-executor = { path = "./statesync-executor" }
kinet-system-calls = { path = "./system-calls" }
kinet-testutil = { path = "./testutil" }
